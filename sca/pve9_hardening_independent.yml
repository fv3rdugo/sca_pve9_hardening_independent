policy:
  id: "pve9_hardening_independent"
  title: "Security Configuration Assessment for pve9 Server"
  file: "pve9_hardening_independent"
  name: "Proxmox VE Server 9.x hardening server"
  description: "This document provides prescriptive guidance for establishing a secure configuration posture for Proxmox VE Server 9.x"
  references:
    - https://www.proxmox.com/en/products/proxmox-virtual-environment/overview
    - https://github.com/HomeSecExplorer/Proxmox-Hardening-Guide.git
    - https://wazuh.com

requirements:
  title: "Check Proxmox VE 9.x Server"
  description: "Requirements for running the SCA scan against pve9 server"
  condition: all
  rules: 
   - 'c:dpkg -s proxmox-ve -> r:Status: install ok'

checks:
  # Add check list
  
  # Use range 100000–299999 for custom checks.
  - id: 100900
    title: "Enable Debian “non-free-firmware” repositories"
    description: "“Non-free” in Debian refers to software that does not comply with the Debian Free Software Guidelines (DFSG)."
    rationale: "Enable Debian non-free-firmware alongside main and contrib to ensure required firmware and microcode are available."
    remediation: "In /etc/apt/sources.list:
                    deb http://deb.debian.org/debian bookworm main contrib non-free-firmware
                    deb http://deb.debian.org/debian bookworm-updates main contrib non-free-firmware
                    deb http://security.debian.org/debian-security bookworm-security main contrib non-free-firmware "
    condition: "all"
    rules:
      - 'f:/etc/apt/sources.list -> r:non-free-firmware'
      - 'f:/etc/apt/sources.list.d/debian.sources -> r:non-free-firmware'

  - id: 100901
    title: "Install CPU microcode"
    description: "Ensures the latest vendor microcode mitigations and stability fixes are applied at boot."
    rationale: "Addresses CPU errata and security vulnerabilities that cannot be fully fixed by system firmware alone."
    remediation: "Install CPU microcode updates: Intel: apt install intel-microcode, AMD: apt install amd64-microcode. Reboot to apply (microcode is loaded at boot)."
    condition: "any"
    rules:
      - 'c:dpkg -s intel-microcode -> r:Status: install ok'
      - 'c:dpkg -s amd64-microcode -> r:Status: install ok'
  
  - id: 100902
    title: "Enable UEFI Secure Boot"
    description: "Since Proxmox Backup Server 4.1, Secure Boot is supported out of the box via signed packages and integration in proxmox-boot-tool."
    rationale: "Shim bootloader signed by Microsoft, fallback bootloader and MOKManager, signed by Proxmox, Grub EFI bootloader, signed by Proxmox and Kernel image, signed by Proxmox"
    remediation: "Install with apt install shim-signed, , AMD: apt install amd64-microcode. Reboot to apply (microcode is loaded at boot)."
    references:
      -  "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html#sysboot_secure_boot"
    condition: "all"
    rules:
      - 'c:dpkg -s shim-signed -> r:Status: install ok'
      - 'c:dpkg -s shim-helpers-amd64-signed -> r:Status: install ok'
      - 'c:dpkg -s grub-efi-amd64-signed -> r:Status: install ok'
      - 'c:dpkg -s proxmox-kernel-6.X.Y-Z-pve-signed -> r:Status: install ok'

  - id: 100903
    title: "Kernel Lockdown (Integrity Mode)"
    description: "When Secure Boot is enabled, the parameter lockdown=integrity blocks unsigned kernel modules, restricts access to /dev/mem, and kernel-space tampering, even by a compromised root account."
    rationale: "Defense-in-depth against kernel-level compromise. It prevents root-level users from modifying the running kernel or loading unauthorized code, which severely limits the blast radius of a potential hypervisor breakout"
    remediation: "Confirm Secure Boot: mokutil --sb-state -> should report 'SecureBoot enabled'. Add GRUB parameter: GRUB_CMDLINE_LINUX_DEFAULT=\"quiet lockdown=integrity\" update-grub reboot"
    condition: "any"
    rules:
      - 'f:/sys/kernel/security/lockdown -> r:[integrity] confidentiality none'

  - id: 100904
    title: "Maintain a Valid Proxmox Subscription"
    description: ""
    rationale: "Subscription provides: 
                Enterprise Repository Access: You gain access to the Proxmox Enterprise Repository, which offers thoroughly tested, highly stable updates and security patches.
                Official Technical Support: Higher tiers include direct ticket-based help from Proxmox engineers to troubleshoot issues and minimize downtime.
                Project Funding: Purchasing a license helps fund the development and maintenance of the open-source platform"
    remediation: "Configuration --> Subscription --> Upload Subscription Key"
    condition: "any"
    rules:
      - 'c:pvesubscription get -> r:status: active' 
      
  - id: 100905
    title: "Enable 2FA"
    description: "Two-factor authentication (2FA) adds an additional factor (TOTP or YubiKey OTP) to mitigate password compromise."
    rationale: "Neutralize the risks of compromised passwords by adding an extra layer of security."
    remediation: "Execute proxmox-backup-manager user list. This command will output a table of all server users and will display whether MFA/TFA is configured"
    condition: "any"
    rules:
      - 'f:/etc/pve/priv/tfa.cfg -> !r:^\{\}$'
 
#  - id: 100906

  # Check active service
  - id: 100907
    title: "Ensure that the Proxmox VE service is running"
    description: ""
    condition: any
    rules:
      - 'c:systemctl is-active pvestatd -> r:^active'

  - id: 100908
    title: 'Check systemd-boot manager'
    description: "The /proc/cmdline file displays the parameters passed to the Linux kernel when the system boots. This virtual file reveals how the system's core was instructed to start, showing options like root partition details, SELinux states, or console configurations. The /etc/kernel/cmdline file is a plain text file that stores parameters passed to the Linux kernel at boot time. It is commonly used on EFI-booted systems running bootloaders like systemd-boot or proxmox-boot to apply settings like IOMMU, driver blacklists, or console behavior."
    rationale: 'Kernel parameters are managed via the /etc/kernel/cmdline file rather than GRUB'
    remediation: 'cat /proc/cmdline > /etc/kernel/cmdline and run proxmox-boot-tool refresh or bootctl update.'
    condition: "all"
    rules:
      - 'f:/etc/kernel/cmdline'
      - 'c:dpkg -s systemd-boot -> r:Status: install ok'

  - id: 100909
    title: 'Check if the necessary boot packages are installed for UEFI, secure boot, shim and systemd boot manager'
    description: "The /proc/cmdline file displays the parameters passed to the Linux kernel when the system boots. This virtual file reveals how the system's core was instructed to start, showing options like root partition details, SELinux states, or console configurations. The /etc/kernel/cmdline file is a plain text file that stores parameters passed to the Linux kernel at boot time. It is commonly used on EFI-booted systems running bootloaders like systemd-boot or proxmox-boot to apply settings like IOMMU, driver blacklists, or console behavior."
    rationale: 'Kernel parameters are managed via the /etc/kernel/cmdline file rather than GRUB'
    remediation: 'cat /proc/cmdline > /etc/kernel/cmdline and run proxmox-boot-tool refresh or bootctl update.'
    condition: "all"
    rules:
      - 'c:dpkg -s shim-helpers-amd64-signed -> r:Status: install ok'
      - 'c:dpkg -s shim-signed -> r:Status: install ok'
      - 'c:dpkg -s systemd-boot-tools -> r:Status: install ok'
      - 'c:dpkg -s systemd-boot-efi -> r:Status: install ok'

  - id: 100910
    title: "Verify your system is booting using UEFI"
    description: "Legacy BIOS is prone to bootkits. UEFI boot mode is required for modern security features like Secure Boot."
    rationale: "Systems booting via UEFI have a dedicated EFI System Partition (ESP) and expose runtime variables under /sys/firmware/efi/."
    remediation: "Reinstall Proxmox VE in UEFI mode via your motherboard's boot menu settings."
    compliance:
      - cis: ["1.1.1"]
    condition: all
    rules:
      - "d:/sys/firmware/efi"

  - id: 100911
    title: "Verify systemd-boot is utilized as the bootloader"
    description: "Proxmox VE uses systemd-boot by default for UEFI installations instead of GRUB."
    rationale: "Ensuring systemd-boot configuration files are present confirms that the system is relying on the intended, streamlined modern bootloader."
    remediation: "If the system was forced to use GRUB, migrate the bootloader to systemd-boot using the 'proxmox-boot-tool init' command."
    compliance:
      - internal: ["bootloader-check"]
    condition: any
    rules:
      - "d:/etc/kernel/sd-templates"
      - "f:/etc/kernel/cmdline"

  - id: 100912
    title: "Ensure Shim/Secure Boot is enabled"
    description: "Verify if the system is booting securely utilizing the Shim bootloader."
    rationale: "Malicious bootloaders can compromise the system before the operating system even loads. Ensuring Shim and Secure Boot are functioning prevents unauthorized kernels from executing."
    remediation: "Install the shim-signed package and enable Secure Boot in your system's UEFI/BIOS settings."
    condition: 'all'
    rules:
      - 'c:mokutil --sb-state -> r:SecureBoot启用|SecureBoot enabled'

  - id: 100913
    title: "Verify /boot/efi is mounted with secure mask permissions"
    description: "The EFI System Partition (vfat) does not support standard Linux permissions. It must be mounted with strict umask, fmask, and dmask options to prevent unauthorized local users from reading or altering boot binaries."
    rationale: "If /boot/efi is mounted with default permissions, sensitive boot configuration and binaries could be read or modified by non-root users, compromising boot integrity."
    remediation: "Edit /etc/fstab and locate the /boot/efi entry. Update the options section to include 'defaults,umask=0077,fmask=0077,dmask=0077' and ensure the pass number at the end is not '1'."
    compliance:
      - cis: ["1.1.1.1"]
    condition: all
    rules:
      - "c:grep '^[^#].*/boot/efi' /etc/fstab | grep -q 'umask=0077' && ! grep '^[^#].*/boot/efi' /etc/fstab | grep -q 'defaults[[:space:]]\\+0[[:space:]]\\+1' && echo 'PASSED' -> r:^PASSED$"

  - id: 100914
    title: "Verify proxmox-boot-tool status is configured for UEFI"
    description: "Proxmox VE utilizes 'proxmox-boot-tool' to manage the systemd-boot configuration on UEFI systems. This check ensures the tool successfully identifies UEFI boot mode and active kernels."
    rationale: "If proxmox-boot-tool reports an error, legacy mode, or missing configured versions, the system's ESP partitions might desynchronize, leading to unbootable kernel updates."
    remediation: "Run 'proxmox-boot-tool status' manually to diagnose the error. You may need to re-sync the ESP partitions using 'proxmox-boot-tool refresh'."
    compliance:
      - internal: ["proxmox-boot-tool"]
    condition: all
    rules:
      - "c:proxmox-boot-tool status | grep -q 'System currently booted with uefi' && echo 'OK' -> r:^OK$"
      - "c:proxmox-boot-tool status | grep -q -E '[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4} is configured with:[[:space:]]+uefi' && echo 'OK' -> r:^OK$"

    # Network security
  - id: 100915
    title: "Verify that PVE is listening on default port (8006)"
    description: ""
    condition: any
    rules:
      - 'c:ss -tlnp -> r::8006'

  # Kernel Security 
  - id: 100916 
    title: "Kernel: Disable IP Forwarding" 
    description: ""
    condition: any 
    rules: 
    - 'c:sysctl net.ipv4.ip_forward -> r:0' 

  # API Token Usage
  - id: 100917
    title: "Ensure API Tokens are used for external integrations (PVE-to-PBS)"
    description: "Verify that at least one API token is defined in user.cfg to avoid using plain user passwords for integrations."
    condition: all
    rules:
      - "f:/etc/pve/user.cfg -> r:token:"

  - id: 100918
    title: "Review API Tokens with Administrator privileges"
    description: "Check if any API token has been granted the Administrator role, which is a security risk."
    condition: none
    rules:
      - "f:/etc/pve/user.cfg -> r:token:.+:Administrator:"

  # Network Service Hardening
  - id: 100919
    title: "Ensure no legacy/insecure remote shells are installed"
    description: ""
    condition: none
    rules:
      - 'c:dpkg -s telnet-server -> r:Status: install ok'
      - 'c:dpkg -s rsh-server -> r:Status: install ok'
      - 'c:dpkg -s nis -> r:Status: install ok'

  # ZFS Dataset Health (Specific to PBS Datastores)
  - id: 100920
    title: "ZFS: Check for checksum errors in pools"
    description: ""
    condition: none
    rules:
      - 'c:zpool status -> r:READ|WRITE|CKSUM\s+[1-9]'

  # APT Update Policy
  - id: 100922
    title: "Ensure security updates repository is present"
    description: ""
    condition: any
    rules:
      - 'f:/etc/apt/sources.list -> r:deb-security'
      - 'f:/etc/apt/sources.list.d/debian.sources -> r:deb-security'

  # No-Subscription repo setup
  - id: 100923
    title: "Ensure security updates via pve-no-subscription or enterprise repo"
    description: ""
    condition: any
    rules:
      - "f:/etc/apt/sources.list.d/pve-install-repo.list -> r:pve-no-subscription"
      - "f:/etc/apt/sources.list.d/pve-enterprise.list -> r:^deb"

  # Fingerprint en storages PBS
  - id: 100924
    title: "Ensure PBS storage uses SSL Fingerprints"
    description: ""
    condition: all
    rules:
      - "f:/etc/pve/storage.cfg -> r:fingerprint"

  # Encrypted backups 
  - id: 100925
    title: "Ensure PBS storage has encryption keys defined"
    description: ""
    condition: all
    rules:
      - "f:/etc/pve/storage.cfg -> r:encryption-key"

  - id: 100926
    title: "Ensure Proxmox Firewall is enabled at Datacenter level"
    description: ""
    condition: all
    rules:
      - "f:/etc/pve/firewall/cluster.fw -> r:enable: 1"

  - id: 100928
    title: "Restrict ptrace scope"
    description: ""
    condition: all
    rules:
      - "c:sysctl kernel.yama.ptrace_scope -> r:1"

  - id: 100929
    title: "Check if IPv6 is disabled if not required"
    description: ""
    condition: all
    rules:
      - "c:sysctl net.ipv6.conf.all.disable_ipv6 -> r:1"

  - id: 100930
    title: "Ensure DCCP kernel module is disabled"
    description: ""
    condition: all
    rules:
      - "c:modprobe -n -v dccp -> r:install /bin/true"

  - id: 100931
    title: "Ensure SCTP kernel module is disabled"
    description: ""
    condition: all
    rules:
      - "c:modprobe -n -v sctp -> r:install /bin/true"

  - id: 100932
    title: "Ensure Floppy driver is disabled"
    description: ""
    condition: all
    rules:
      - "c:modprobe -n -v floppy -> r:install /bin/true"

  - id: 100933
    title: "Ensure personalized accounts are defined in PVE"
    description: "Checks if there are other users defined in Proxmox besides the default root@pam."
    condition: all
    rules:
      - "f:/etc/pve/user.cfg -> r:user:[^:]+@(pam|pve):"
      - "f:/etc/pve/user.cfg -> n:user:root@pam:"

  - id: 100934
    title: "Ensure Two-Factor Authentication (2FA) is enabled"
    description: "Checks if there is any TFA configuration (TOTP, WebAuthn, Yubico) in the PVE cluster."
    condition: all
    rules:
      - 'f:/etc/pve/tfa.cfg -> r:type:'

  - id: 100935
    title: 'Ensure PVE Web UI session timeout is configured'
    description: ''
    condition: all
    rules:
      - 'f:/usr/share/perl5/PVE/AccessControl.pm -> r:my \\$ticket_lifetime = \\d+'

  - id: 100936
    title: 'Ensure a trusted SSL certificate is used for the GUI'
    description: 'Checks if the PVE proxy is using a custom certificate instead of the default self-signed one.'
    condition: all
    rules:
      - 'f:/etc/pve/local/pveproxy-ssl.pem'
      - 'c:openssl x509 -in /etc/pve/local/pveproxy-ssl.pem -noout -issuer -> !r:Proxmox Virtual Environment'